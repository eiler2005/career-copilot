    <title>states</title>
    <polygon fill="#ffffff" stroke="none" points="-20.16,20.16 -20.16,-616.23 517.66,-616.23 517.66,20.16 -20.16,20.16" />
    <text text-anchor="start" x="29.38" y="-571.22" font-family="Arial" font-weight="bold" font-size="23.00" fill="#173b45">Independent states. Verifiable numbers.</text>
    <text text-anchor="start" x="107.38" y="-557.72" font-family="Arial" font-size="13.00" fill="#526a72">Separate dimensions, not a single status funnel</text>
    <g id="node1" class="node">
      <title>dimensions</title>
      <path fill="#f2f7f8" stroke="none" stroke-width="1.1" d="M485.5,-552.07C485.5,-552.07 12,-552.07 12,-552.07 6,-552.07 0,-546.07 0,-540.07 0,-540.07 0,-239.07 0,-239.07 0,-233.07 6,-227.07 12,-227.07 12,-227.07 485.5,-227.07 485.5,-227.07 491.5,-227.07 497.5,-233.07 497.5,-239.07 497.5,-239.07 497.5,-540.07 497.5,-540.07 497.5,-546.07 491.5,-552.07 485.5,-552.07" />
