# Optional authenticated HTTPS gateway. Use together with compose.yaml:
#   docker compose -f compose.yaml -f compose.public.yaml up -d --build
# The host's edge proxy must forward TLS for CC_PUBLIC_HOST to 127.0.0.1:CC_GATEWAY_PORT.
services:
  dashboard:
    environment:
      AJH_DASHBOARD_ALLOWED_HOSTS: "${CC_PUBLIC_HOST:?Set CC_PUBLIC_HOST to the public dashboard hostname}"

  gateway:
    image: caddy:2.11.4-alpine
    container_name: career-copilot-gateway
    depends_on:
      dashboard:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CC_GATEWAY_PORT:-8445}:8445"
    environment:
      CC_PUBLIC_HOST: "${CC_PUBLIC_HOST:?Set CC_PUBLIC_HOST}"
      CC_BASIC_USER: "${CC_BASIC_USER:?Set CC_BASIC_USER}"
      CC_BASIC_HASH: "${CC_BASIC_HASH:?Set CC_BASIC_HASH to a bcrypt hash}"
      ACME_EMAIL: "${ACME_EMAIL:?Set ACME_EMAIL for certificate notices}"
    volumes:
      - ./deploy/public-gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway_data:/data
      - gateway_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    # The image's caddy binary carries a file capability; exec fails if it is outside the bounding set.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"

volumes:
  gateway_data:
  gateway_config:
