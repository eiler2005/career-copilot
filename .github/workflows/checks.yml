name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - run: uv sync --frozen
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - name: Check bilingual documentation and skill entrypoints
        run: uv run python scripts/check_docs.py
      - name: Exercise the offline CLI and verified restore
        run: uv run python scripts/demo_workflow.py --home "$RUNNER_TEMP/career-copilot-demo"
      - run: uv run ajh privacy check --scope index && uv run ajh privacy check --scope history
      - name: Install pinned Gitleaks with checksum verification
        shell: bash
        run: |
          ajh_scan_tools=$(mktemp -d)
          cd "$ajh_scan_tools"
          curl --fail --location --retry 2 --max-time 120 --remote-name https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --retry 2 --max-time 120 --remote-name https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan exact staging and full history with redacted output
        run: uv run ajh privacy check --scope index --gitleaks && uv run ajh privacy check --scope history --gitleaks
