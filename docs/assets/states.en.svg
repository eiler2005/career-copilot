      <text text-anchor="start" x="13" y="-519.82" font-family="Arial" font-weight="bold" font-size="15.00" fill="#183d48">Vacancy availability</text>
      <text text-anchor="start" x="18.25" y="-507.67" font-family="Arial" font-size="12.00" fill="#183d48">Open / closed / unknown</text>
      <polygon fill="#f2f7f8" stroke="none" points="215,-487.07 215,-552.07 497.5,-552.07 497.5,-487.07 215,-487.07" />
      <polygon fill="none" stroke="#d1dee2" points="215,-487.07 215,-552.07 497.5,-552.07 497.5,-487.07 215,-487.07" />
      <text text-anchor="start" x="228" y="-525.82" font-family="Arial" font-weight="bold" font-size="15.00" fill="#183d48">Observation</text>
      <text text-anchor="start" x="228" y="-513.67" font-family="Arial" font-size="12.00" fill="#183d48">Official source + date.</text>
      <text text-anchor="start" x="228" y="-501.67" font-family="Arial" font-size="12.00" fill="#183d48">A collection error does not mean closed.</text>
      <polygon fill="#e8eef8" stroke="none" points="0,-422.07 0,-487.07 215,-487.07 215,-422.07 0,-422.07" />
      <polygon fill="none" stroke="#d1dee2" points="0,-422.07 0,-487.07 215,-487.07 215,-422.07 0,-422.07" />
      <text text-anchor="start" x="13" y="-454.82" font-family="Arial" font-weight="bold" font-size="15.00" fill="#183d48">Candidate fit</text>
      <text text-anchor="start" x="13" y="-442.67" font-family="Arial" font-size="12.00" fill="#183d48">Requirements and constraints</text>
      <polygon fill="#f2f7f8" stroke="none" points="215,-422.07 215,-487.07 497.5,-487.07 497.5,-422.07 215,-422.07" />
      <polygon fill="none" stroke="#d1dee2" points="215,-422.07 215,-487.07 497.5,-487.07 497.5,-422.07 215,-422.07" />
      <text text-anchor="start" x="228" y="-460.82" font-family="Arial" font-weight="bold" font-size="15.00" fill="#183d48">Evidence</text>
      <text text-anchor="start" x="228" y="-448.67" font-family="Arial" font-size="12.00" fill="#183d48">Facts, level, eligibility, track.</text>
      <text text-anchor="start" x="228" y="-436.67" font-family="Arial" font-size="12.00" fill="#183d48">Unknowns need clarification.</text>
      <polygon fill="#e7f3ef" stroke="none" points="0,-357.07 0,-422.07 215,-422.07 215,-357.07 0,-357.07" />
      <polygon fill="none" stroke="#d1dee2" points="0,-357.07 0,-422.07 215,-422.07 215,-357.07 0,-357.07" />
      <text text-anchor="start" x="13" y="-389.82" font-family="Arial" font-weight="bold" font-size="15.00" fill="#183d48">Document readiness</text>
      <text text-anchor="start" x="40.75" y="-377.67" font-family="Arial" font-size="12.00" fill="#183d48">pending / passed</text>
      <polygon fill="#f2f7f8" stroke="none" points="215,-357.07 215,-422.07 497.5,-422.07 497.5,-357.07 215,-357.07" />
      <polygon fill="none" stroke="#d1dee2" points="215,-357.07 215,-422.07 497.5,-422.07 497.5,-357.07 215,-357.07" />
      <text text-anchor="start" x="228" y="-395.82" font-family="Arial" font-weight="bold" font-size="15.00" fill="#183d48">Exact version</text>
      <text text-anchor="start" x="228" y="-383.67" font-family="Arial" font-size="12.00" fill="#183d48">Authorship, content and visual review.</text>
      <text text-anchor="start" x="235.12" y="-371.67" font-family="Arial" font-size="12.00" fill="#183d48">New hashes require a fresh review.</text>
      <polygon fill="#fff3dd" stroke="none" points="0,-292.07 0,-357.07 215,-357.07 215,-292.07 0,-292.07" />
      <polygon fill="none" stroke="#d1dee2" points="0,-292.07 0,-357.07 215,-357.07 215,-292.07 0,-292.07" />
      <text text-anchor="start" x="13" y="-324.82" font-family="Arial" font-weight="bold" font-size="15.00" fill="#183d48">Submission evidence</text>
      <text text-anchor="start" x="13" y="-312.67" font-family="Arial" font-size="12.00" fill="#183d48">Version, channel, time, confirmation</text>
      <polygon fill="#f2f7f8" stroke="none" points="215,-292.07 215,-357.07 497.5,-357.07 497.5,-292.07 215,-292.07" />
      <polygon fill="none" stroke="#d1dee2" points="215,-292.07 215,-357.07 497.5,-357.07 497.5,-292.07 215,-292.07" />
      <text text-anchor="start" x="228" y="-330.82" font-family="Arial" font-weight="bold" font-size="15.00" fill="#183d48">External action</text>
      <text text-anchor="start" x="228" y="-318.67" font-family="Arial" font-size="12.00" fill="#183d48">Separate authorization and evidence.</text>
      <text text-anchor="start" x="228.38" y="-306.67" font-family="Arial" font-size="12.00" fill="#183d48">A ready package does not send itself.</text>
      <polygon fill="#f1eef8" stroke="none" points="0,-227.07 0,-292.07 215,-292.07 215,-227.07 0,-227.07" />
      <polygon fill="none" stroke="#d1dee2" points="0,-227.07 0,-292.07 215,-292.07 215,-227.07 0,-227.07" />
      <text text-anchor="start" x="13" y="-259.82" font-family="Arial" font-weight="bold" font-size="15.00" fill="#183d48">Interview preparation</text>
      <text text-anchor="start" x="25.75" y="-247.67" font-family="Arial" font-size="12.00" fill="#183d48">Plan, practice, feedback</text>
      <polygon fill="#f2f7f8" stroke="none" points="215,-227.07 215,-292.07 497.5,-292.07 497.5,-227.07 215,-227.07" />
      <polygon fill="none" stroke="#d1dee2" points="215,-227.07 215,-292.07 497.5,-292.07 497.5,-227.07 215,-227.07" />
      <text text-anchor="start" x="228" y="-265.82" font-family="Arial" font-weight="bold" font-size="15.00" fill="#183d48">Demonstrated progress</text>
      <text text-anchor="start" x="228" y="-253.67" font-family="Arial" font-size="12.00" fill="#183d48">Reading a resource does not prove skill.</text>
      <text text-anchor="start" x="228" y="-241.67" font-family="Arial" font-size="12.00" fill="#183d48">A learning project does not become work history.</text>
    </g>
